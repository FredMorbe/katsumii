name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # sitemap <lastmod> comes from per-file git history (scripts/seo-routes.mjs)
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # postbuild = headless-Chrome prerender (scripts/prerender.mjs) + SEO audit
      # (tools/seo-audit.mjs). Uses the runner's preinstalled google-chrome and
      # fails the deploy on any SEO regression.
      - name: Build site
        run: npm run build
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # Without this the action tars dist/ with --exclude=.[^/]* and drops
          # dot-directories, so public/.well-known/security.txt 404s in production.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
