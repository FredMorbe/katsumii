const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
  experience: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>',
  lab: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
  skills: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>',
  contact: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>'
};
const VIEWS = [["overview", "Overview", jobs.length + 1 > 0 ? "" : ""], ["experience", "Experience", jobs.length], ["lab", "AI Lab", CV.projects.length], ["skills", "Skills", skills.length], ["contact", "Contact", ""]];
const hue = (r) => `--h:${r.hue}`;

/* chrome */
$("#t1").textContent = CV.title; $("#avail").textContent = CV.availability; $("#mail").href = "mailto:" + CV.email;
$("#nav").insertAdjacentHTML("beforeend", VIEWS.map(([id, l, n], i) => `<button data-v="${id}">${IC[id]}<span>${l}</span><small>${i + 1}</small></button>`).join(""));
$("#tabbar").innerHTML = VIEWS.map(([id, l]) => `<button data-v="${id}">${IC[id]}<span>${l}</span></button>`).join("");
$("#dl").onclick = () => toast("Mockup: would download Sam-Keller-CV.pdf");

/* ── views ── */
const V = {};
V.overview = () => {
  const T0 = cvIdx("2015-10"), T1 = cvIdx(CV.now) + 1, X = (m) => ((m - T0) / (T1 - T0)) * 100;
  const bar = (r, i) => `<div class="b" style="${hue(r)};left:${X(cvIdx(r.from))}%;width:${X(cvIdx(cvEnd(r)) + 1) - X(cvIdx(r.from))}%;animation-delay:${i * .12}s" data-go="${r.side ? "lab" : "experience/" + r.id}" title="${r.org} · ${cvDur(r)}">${r.org.split(" ")[0]}</div>`;
  return `<div class="view"><div class="stg">
   <div style="--i:0"><p class="lbl">Welcome</p><h2 class="h1">Hello, I’m Sam.</h2><p class="lead">${CV.summary}</p></div>
   <div class="st4" style="--i:1">${CV.stats.map((s) => `<div class="c"><b data-v="${s.v}" data-s="${s.suffix}">0<i>${s.suffix}</i></b><span>${s.label}</span></div>`).join("")}</div>
   <div class="c tlc" style="--i:2"><h3>Career at a glance</h3><div class="gt"><div class="ax">${[2016, 2018, 2020, 2022, 2024, 2026].map((y) => `<span>${y}</span>`).join("")}</div>
     <div class="tr"><span>Day job</span><div class="lane">${jobs.map(bar).join("")}</div></div><div class="tr"><span>After hours</span><div class="lane">${bar(labRole, 5)}</div></div></div></div>
   <div class="g3" style="--i:3">${[jobs[2], jobs[1], jobs[3]].map((r) => `<div class="c hv" data-go="experience/${r.id}"><b>${r.metric.v}</b><strong>${r.metric.l}</strong><p>${r.hook}</p><small>${r.org} · ${r.from.slice(0, 4)}–${r.to ? r.to.slice(0, 4) : "now"}</small></div>`).join("")}</div>
   <div class="now" style="--i:4"><div class="c hv" data-go="experience/meridian"><span class="dot">${IC.experience}</span><div><b>Right now · day job</b><p>Lead engineer at Meridian Industrial — new drive platform, team of twelve.</p></div></div><div class="c hv" data-go="lab"><span class="dot">${IC.lab}</span><div><b>Right now · after hours</b><p>Building apps with AI assistance — four shipped, the next one in progress.</p></div></div></div>
  </div></div>`; };

let sel = jobs[jobs.length - 1].id;
V.experience = (id) => { if (id) sel = id; const list = jobs.slice().reverse();
  return `<div class="view"><p class="lbl">Day job</p><h2 class="h1">Eleven years of engineering.</h2><p class="lead">From drawing board to series production. Pick a station.</p>
  <div class="exp"><div class="rl stg">${list.map((r, i) => `<button data-r="${r.id}" style="${hue(r)};--i:${i}" class="${r.id === sel ? "on" : ""}"><b>${r.org}</b><span>${r.role}</span><small>${cvRange(r)}</small></button>`).join("")}</div><article class="c dt" id="dt"></article></div></div>`; };
function fillRole() { const r = cvRole(sel), v = VZ.by[r.id](), list = jobs.slice().reverse(), i = list.indexOf(r), prev = list[i - 1], next = list[i + 1], d = $("#dt"); if (!d) return;
  d.style.cssText = hue(r); d.innerHTML = `<header><span class="mon">${r.org[0]}</span><div><h2>${r.org}</h2><p>${r.role} · ${r.place}</p></div><div class="per">${cvRange(r)}<br>${cvDur(r)}</div></header>
   <p class="hook">${r.hook}</p><p class="sum">${r.summary}</p>
   <div class="dg"><ul class="outs">${r.bullets.map((b) => `<li>${CHECK}<span>${b}</span></li>`).join("")}</ul><div class="vzp"><div class="vzh">${v.title}</div><div class="vz">${v.html}<p class="vcap">${v.cap}</p></div></div></div>
   <div class="tags">${r.skills.map((s) => `<span>${s}</span>`).join("")}</div>
   <div class="pager"><button ${prev ? `data-r="${prev.id}"` : "disabled style=opacity:.3"}>← ${prev ? prev.org : ""}</button><button ${next ? `data-r="${next.id}"` : "disabled style=opacity:.3"}>${next ? next.org : ""} →</button></div>`;
  $$(".rl button").forEach((b) => b.classList.toggle("on", b.dataset.r === sel)); requestAnimationFrame(() => requestAnimationFrame(() => $(".vz", d) && $(".vz", d).classList.add("in"))); }

V.lab = () => `<div class="view"><p class="lbl">After hours · passion</p><h2 class="h1">${LAB.headline}</h2><p class="lead">${LAB.sub}</p>
  <div class="lab stg"><div class="c term" style="--i:0"><div class="uh"><i></i><i></i><i></i><span>~/katsumii — claude</span></div><pre id="term"></pre></div>
  <div class="prin" style="--i:1">${LAB.principles.map((p, i) => `<div class="c"><b><i>0${i + 1}</i>${p.t}</b><p>${p.d}</p></div>`).join("")}</div></div>
  <div class="apps stg">${CV.projects.map((p, i) => `<div class="c pj" style="--c:${p.accent};--i:${i + 2}"><small>${p.kind} · ${p.year}</small><h3>${p.name}</h3><p>${p.desc}</p><div class="tags">${p.stack.concat("AI-assisted").map((s) => `<span>${s}</span>`).join("")}</div></div>`).join("")}</div>
  <div class="stp">${LAB.timeline.map((t) => `<div><b>${t.y}</b><p>${t.t}</p></div>`).join("")}</div></div>`;
async function typeTerm() { const pre = $("#term"); if (!pre) return; const sl = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms)); const token = (typeTerm.t = (typeTerm.t || 0) + 1);
  for (const l of LAB.terminal) { if (token !== typeTerm.t || !$("#term")) return; const d = document.createElement("div"); d.className = l.t; pre.appendChild(d);
    if (l.t === "cmd" || l.t === "you") { d.classList.add("cur"); for (const ch of l.s) { if (token !== typeTerm.t) return; d.textContent += ch; await sl(l.t === "cmd" ? 70 : 22); } d.classList.remove("cur"); await sl(420); } else { d.textContent = l.s; await sl(l.t === "dim" ? 600 : 480); } }
  pre.lastChild && pre.lastChild.classList.add("cur"); }

let skSel = skills[0].name, skQ = "";
V.skills = () => `<div class="view"><p class="lbl">Toolbox</p><h2 class="h1">What I work with.</h2><p class="lead">${skills.length} skills across engineering, data, leadership and AI. Click one to see where it was used.</p>
  <div class="sk"><div><label class="srch"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sq" placeholder="Filter skills…" value="${cvEsc(skQ)}" autocomplete="off"></label><div id="sgroups"></div></div><aside class="c sd" id="sd"></aside></div></div>`;
function fillSkills() { const q = skQ.toLowerCase(); $("#sgroups").innerHTML = CV.categories.map((c) => `<div class="grp" style="--c:${CV.catColor[c]}"><h4><i></i>${c}</h4><div class="skl">${skills.filter((s) => s.cat === c).map((s) => `<button data-s="${cvEsc(s.name)}" class="${s.name === skSel ? "on" : ""}${q && !s.name.toLowerCase().includes(q) ? " dim" : ""}" style="--c:${CV.catColor[c]}">${s.name}<span class="pips">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= s.level ? "on" : ""}"></i>`).join("")}</span></button>`).join("")}</div></div>`).join("");
  const s = skills.find((x) => x.name === skSel); $("#sd").innerHTML = `<p class="lbl" style="color:${CV.catColor[s.cat]}">${s.cat}</p><h3>${s.name}</h3><div class="big"><div><b>${s.level}/5</b><span>proficiency</span></div><div><b>${s.years}</b><span>years in use</span></div><div><b>${s.roles.length}</b><span>roles</span></div></div><p class="lbl">Used in</p><ul>${s.roles.map((id) => { const r = cvRole(id); return `<li><button data-go="${r.side ? "lab" : "experience/" + r.id}"><span>${r.org}</span><small>${r.from.slice(0, 4)}–${r.to ? r.to.slice(0, 4) : "now"}</small></button></li>`; }).join("")}</ul>`; }

let kind = "Both";
V.contact = () => `<div class="view"><p class="lbl">Contact</p><h2 class="h1">Got a hard problem?</h2><p class="lead">Mechanical, digital — or both. Tell me what you’re building.</p>
  <div class="ct stg"><div class="c" style="--i:0"><h3>Direct</h3><div class="lk"><a href="mailto:${CV.email}">${CV.email}<small>write</small></a><button id="cp">Copy email address<small>copy</small></button><button data-t="${CV.linkedin}">LinkedIn<small>${CV.linkedin}</small></button><button data-t="${CV.github}">GitHub<small>${CV.github}</small></button></div>
    <div class="clock"><span>Local time in ${CV.city}</span><b id="clk">--:--</b></div></div>
   <form class="c f" id="form" style="--i:1"><h3>Send a message</h3><div class="seg" id="seg">${["Mechanical", "Digital", "Both"].map((k) => `<button type="button" data-k="${k}" class="${k === kind ? "on" : ""}">${k}</button>`).join("")}</div><input placeholder="Your name" required><input type="email" placeholder="Email" required><textarea placeholder="What are you building? What’s the hard part?" required></textarea><button class="btn p" type="submit" id="send">Send message</button></form></div></div>`;

/* ── router ── */
let cur = "";
function go(path, push = true) {
  const [v, arg] = path.split("/"); const name = V[v] ? v : "overview"; cur = name; typeTerm.t = (typeTerm.t || 0) + 1;
  $("#view").innerHTML = V[name](arg); const idx = VIEWS.findIndex((x) => x[0] === name);
  $$("#nav button,#tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.v === name)); { const ob = $("#nav button.on"); if (ob) { $("#ind").style.height = ob.offsetHeight + "px"; $("#ind").style.transform = `translateY(${ob.offsetTop}px)`; } } $("#crumb").textContent = VIEWS[idx][1];
  if (name === "experience") fillRole(); if (name === "skills") fillSkills(); if (name === "lab") setTimeout(typeTerm, 500);
  $$("[data-v]", $("#view")).forEach(count); if (name === "contact") tick();
  if (push) history.replaceState(null, "", "#/" + (name === "experience" ? "experience/" + sel : name)); scrollTo({ top: 0, behavior: "instant" });
}
function count(b) { if (!b.dataset.v) return; const v = +b.dataset.v, u = b.dataset.s, t0 = performance.now(); if (reduce) { b.innerHTML = v + `<i>${u}</i>`; return; } (function f(t) { const k = clamp((t - t0) / 1300), e = 1 - Math.pow(1 - k, 4); b.innerHTML = Math.round(v * e) + `<i>${u}</i>`; if (k < 1) requestAnimationFrame(f); })(t0); }
function tick() { const e = $("#clk"); if (e) e.textContent = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date()); }
setInterval(tick, 15000);

document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"), n = e.target.closest("#nav button,#tabbar button"), r = e.target.closest("[data-r]"), s = e.target.closest("[data-s]"), k = e.target.closest("#seg button"), t = e.target.closest("[data-t]");
  if (g) { const [v, a] = g.dataset.go.split("/"); if (a) sel = a; go(g.dataset.go); }
  else if (n) go(n.dataset.v);
  else if (r && cur === "experience") { sel = r.dataset.r; fillRole(); history.replaceState(null, "", "#/experience/" + sel); }
  else if (s) { skSel = s.dataset.s; fillSkills(); }
  else if (k) { kind = k.dataset.k; $$("#seg button").forEach((b) => b.classList.toggle("on", b === k)); }
  else if (t) toast("Mockup: would open " + t.dataset.t);
  else if (e.target.closest("#cp")) { try { navigator.clipboard.writeText(CV.email); } catch (_) {} toast("Copied " + CV.email); }
});
document.addEventListener("input", (e) => { if (e.target.id === "sq") { skQ = e.target.value; fillSkills(); } });
document.addEventListener("submit", (e) => { if (e.target.id === "form") { e.preventDefault(); const b = $("#send"); b.textContent = "Sent ✓ (mockup)"; toast("Mockup: nothing was sent"); setTimeout(() => (b.textContent = "Send message"), 2200); } });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-5]$/.test(e.key)) go(VIEWS[+e.key - 1][0]);
  else if (cur === "experience" && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); const list = jobs.slice().reverse(), i = list.findIndex((r) => r.id === sel), j = clamp(i + (e.key === "ArrowDown" ? 1 : -1), 0, list.length - 1); sel = list[j].id; fillRole(); history.replaceState(null, "", "#/experience/" + sel); }
});
const themeBtn = () => { const h = document.documentElement, n = h.dataset.theme === "dark" ? "light" : "dark"; h.dataset.theme = n; try { localStorage.setItem("cv-ws-theme", n); } catch (_) {} };
$("#theme").onclick = themeBtn; $("#theme2").onclick = themeBtn;
try { const s = localStorage.getItem("cv-ws-theme"); if (s) document.documentElement.dataset.theme = s; } catch (_) {}
addEventListener("hashchange", () => { const p = location.hash.replace(/^#\/?/, ""); if (p) { const [v, a] = p.split("/"); if (a) sel = a; go(p, false); } });
{ const p = location.hash.replace(/^#\/?/, "") || "overview"; const [v, a] = p.split("/"); if (a && cvRole(a)) sel = a; go(p, false); }
</script>
</body></html>
